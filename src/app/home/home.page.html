<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Registro de Usuario</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="toggleModoOscuro()">
        {{ modoOscuro() ? 'Modo claro' : 'Modo oscuro' }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <!-- Enlace del FormGroup definido en TypeScript -->
  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <ion-list lines="full">
      <!-- Campo Nombre -->
      <ion-item>
        <ion-input
          label="Nombre completo"
          labelPlacement="floating"
          type="text"
          formControlName="nombre"
          [errorText]="'El nombre es obligatorio (mín. 3 caracteres).'">
        </ion-input>
      </ion-item>
      <!-- Campo Email con teclado específico para móviles -->
      <ion-item>
        <ion-input
          label="Correo Electrónico"
          labelPlacement="floating"
          type="email"
          inputmode="email"
          formControlName="email"
          [errorText]="'Introduzca un email válido.'">
        </ion-input>
      </ion-item>
      <!-- Campo Fecha de nacimiento: [max] limita el calendario y el validador fechaNoFutura lo comprueba -->
      <ion-item>
        <ion-input
          label="Fecha de nacimiento"
          labelPlacement="stacked"
          type="date"
          [max]="hoy"
          formControlName="fechaNacimiento"
          errorText="Introduce una fecha que no sea posterior a hoy.">
        </ion-input>
      </ion-item>
      <!-- Campo Contraseña -->
      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          type="password"
          formControlName="password"
          [errorText]="'Mínimo 8 caracteres, letras y números.'">
        </ion-input>
      </ion-item>
    </ion-list>
    <div class="ion-padding-top">
      <!-- Botón dinámico que responde al Signal -->
      <ion-button expand="block" type="submit" [disabled]="registroForm.invalid || isSubmitting()">
        @if (isSubmitting()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <span>Registrarse</span>
        }
      </ion-button>
      <!-- Solo aparece cuando ya se ha enviado el formulario -->
      @if (ultimoEnvio()) {
        <ion-button expand="block" fill="outline" (click)="descargarPdf()">
          Descargar PDF
        </ion-button>
      }
    </div>
  </form>
</ion-content>
