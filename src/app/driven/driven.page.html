<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Template-Driven</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <!-- #regForm="ngForm" da acceso al formulario que Angular crea a partir de este HTML -->
  <form #regForm="ngForm" (ngSubmit)="onSubmit(regForm)">
    <ion-list lines="full">
      <!-- Campo Nombre: las validaciones son atributos -->
      <ion-item>
        <ion-input
          label="Nombre completo"
          labelPlacement="floating"
          type="text"
          name="nombre"
          [(ngModel)]="modelo.nombre"
          required
          minlength="3"
          errorText="El nombre es obligatorio (mín. 3 caracteres).">
        </ion-input>
      </ion-item>
      <!-- Campo Email con teclado específico para móviles -->
      <ion-item>
        <ion-input
          label="Correo Electrónico"
          labelPlacement="floating"
          type="email"
          inputmode="email"
          name="email"
          [(ngModel)]="modelo.email"
          required
          email
          errorText="Introduzca un email válido.">
        </ion-input>
      </ion-item>
      <!-- Campo Fecha de nacimiento: appFechaNoFutura es la directiva del validador personalizado -->
      <ion-item>
        <ion-input
          label="Fecha de nacimiento"
          labelPlacement="stacked"
          type="date"
          [max]="hoy"
          name="fechaNacimiento"
          [(ngModel)]="modelo.fechaNacimiento"
          required
          appFechaNoFutura
          errorText="Introduce una fecha que no sea posterior a hoy.">
        </ion-input>
      </ion-item>
      <!-- Campo Contraseña -->
      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          type="password"
          name="password"
          [(ngModel)]="modelo.password"
          required
          pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$"
          errorText="Mínimo 8 caracteres, letras y números.">
        </ion-input>
      </ion-item>
    </ion-list>
    <div class="ion-padding-top">
      <ion-button expand="block" type="submit" [disabled]="regForm.invalid || isSubmitting()">
        @if (isSubmitting()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <span>Registrarse</span>
        }
      </ion-button>
      <ion-button expand="block" fill="clear" routerLink="/registro">
        Ver versión Reactive Forms
      </ion-button>
    </div>
  </form>
</ion-content>
